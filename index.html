<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Study Planner</title>

    <!-- 아이콘 -->
    <link rel="icon" type="image/png" href="./image/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- 메뉴바 -->
    <nav class="navbar">

        <div class="nav-left">

            <!-- 로고 -->
            <div class="logo"
                 onclick="location.reload()">

                📚 Study Planner

            </div>

            <!-- 검색 -->
            <div class="nav-search">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text"
                       id="searchInput"
                       placeholder="검색..."
                       onkeyup="searchTask()">

            </div>

        </div>


        <!-- 메뉴 -->
        <div class="menu-right">

            <button onclick="showAll()">
                전체
            </button>

            <button onclick="showCompleted()">
                완료
            </button>

            <button onclick="sortNewest()">
                최신순
            </button>

            <button onclick="sortOldest()">
                오래된순
            </button>


            <!-- 테마 -->
            <select id="themeSelect"
                    onchange="changeTheme()">

                <option value="light">
                    🌞 라이트
                </option>

                <option value="dark">
                    🌙 다크
                </option>

                <option value="blue">
                    🔵 블루
                </option>

                <option value="purple">
                    🟣 퍼플
                </option>

                <option value="green">
                    🟢 그린
                </option>

                <option value="pink">
                    🌸 핑크
                </option>

                <option value="orange">
                    🟠 오렌지
                </option>

                <option value="sky">
                    ☁️ 스카이
                </option>

                </option>

                <option value="system">
                    💻 시스템
                </option>

            </select>

        </div>

    </nav>



    <!-- 본문 -->
    <div class="container">

        <!-- 명언 -->
        <p class="quote"
           id="quote"></p>


        <!-- 공부 시간 -->
        <div class="study-time-box">

            <h3>
                ⏱ 오늘 공부 시간
            </h3>

            <p id="studyTime">
                00:00:00
            </p>

            <button id="studyBtn"
                    onclick="toggleStudy()">

                시작

            </button>

            <button onclick="resetStudyTime()">
                초기화
            </button>

        </div>


        <!-- 포모도로 -->
        <div class="pomodoro-wrapper">

            <h3>
                🍅 포모도로
            </h3>


            <!-- 시간 선택 -->
            <select id="pomodoroSelect"
                    onchange="setPomodoroFromSelect()">

                <option value="1500">
                    25분
                </option>

                <option value="1800">
                    30분
                </option>

                <option value="3000">
                    50분
                </option>

                <option value="3600">
                    60분
                </option>

            </select>


            <!-- 직접 입력 -->
            <input type="number"
                   id="customPomodoro"
                   placeholder="분 입력"
                   min="1"
                   onkeypress="handlePomodoroEnter(event)">


            <!-- 시간 -->
            <p id="pomodoroTime">
                25:00
            </p>


            <!-- 버튼 -->
            <div class="pomodoro-buttons">

                <button id="pomodoroBtn"
                        onclick="togglePomodoro()">

                    시작

                </button>

                <button onclick="resetPomodoro()">
                    초기화
                </button>

            </div>

        </div>


        <!-- D-Day -->
        <div class="dday-center">

            <h2 id="dDay">
                시험 날짜를 설정해주세요
            </h2>

            <div class="dday-box">

                <input type="date"
                       id="examDate">

                <button onclick="setDday()">
                    D-Day 설정
                </button>

            </div>

        </div>


        <!-- 날짜 -->
        <div class="calendar-box">

            <h2 id="date"></h2>

            <p id="time"></p>

        </div>


        <!-- 진행률 -->
        <div class="progress-container">

            <div id="progressBar"></div>

        </div>

        <p id="progressText">
            진행률 0%
        </p>



        <!-- 입력 -->
        <div class="input-box">

            <!-- 공부 입력 -->
            <input type="text"
                   id="taskInput"
                   placeholder="공부할 내용을 입력하세요"
                   onkeypress="handleEnter(event)">


            <!-- 카테고리 -->
            <input type="text"
                   id="category"
                   placeholder="카테고리 입력">


            <!-- 날짜 -->
            <input type="date"
                   id="taskDate">


            <!-- 중요도 -->
            <select id="priority">

                <option value="important">
                    🔴 중요
                </option>

                <option value="normal">
                    🟡 보통
                </option>

                <option value="low">
                    🟢 낮음
                </option>

            </select>


            <!-- 추가 -->
            <button onclick="addTask()">
                추가
            </button>


            <!-- 전체 삭제 -->
            <button class="delete-all-btn"
                    onclick="deleteAll()">

                전체 삭제

            </button>

        </div>


        <!-- 리스트 -->
        <ul id="taskList"></ul>


        <!-- 알림 -->
        <div id="notification"
             class="notification">

        </div>
        
        <audio id="alarmSound" src="./sound/bell.mp3"></audio>
    </div>


    <!-- JS -->
    <script src="js/script.js"></script>

</body>

</html>
